<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSA 강의 슬라이드</title>
<style>
 :root{--ink:#1e1b33;--dim:#6a6580;--acc:#2E3192;--line:#e4e0d4;--bg:#f7f5f0;--card:#fff}
 @media(prefers-color-scheme:dark){:root{--ink:#e9e7f2;--dim:#9d99b4;--acc:#8f92e6;
   --line:#2f2b45;--bg:#141225;--card:#1d1a30}}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
   font:15px/1.6 "IBM Plex Sans KR",system-ui,"Noto Sans KR",sans-serif}
 .w{max-width:760px;margin:0 auto;padding:48px 22px 80px}
 h1{font-size:24px;margin:0 0 4px}.sub{color:var(--dim);font-size:13px;margin-bottom:28px}
 h3{font-size:13px;margin:18px 0 6px;color:var(--dim)}h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);
   margin:32px 0 8px}
 ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);
   border-radius:12px;overflow:hidden}
 li{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;
   justify-content:space-between;gap:12px}
 li:last-child{border-bottom:none}
 a{color:var(--ink);text-decoration:none;font-weight:600}a:hover{color:var(--acc)}
 .pend{color:var(--dim)}a.m{color:var(--acc)}.m{color:var(--dim);font-size:12px;font-family:ui-monospace,monospace;
   white-space:nowrap}
details{margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}summary{cursor:pointer;padding:11px 16px;font-weight:600;display:flex;justify-content:space-between;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:"▸";margin-right:8px;color:var(--acc)}details[open] summary::before{content:"▾"}summary span{margin-left:auto}details ul{border:none;border-top:1px solid var(--line);border-radius:0}summary .wk,summary .t,summary .tag{margin-left:0}summary .tag{margin-left:8px}.wk{color:var(--acc);font-weight:700;min-width:3.4em}.t{flex:1}.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:8px;white-space:nowrap}
.tag.mid{background:#dfe3fb;color:#2E3192}.tag.fin{background:#f1e8cf;color:#7a6a3a}.tag.ex{background:#f9dcdc;color:#a33}
@media(prefers-color-scheme:dark){.tag.mid{background:#2c2f6b;color:#c9cbff}.tag.fin{background:#4a4126;color:#e8dcb0}.tag.ex{background:#5a2a2a;color:#ffc9c9}}
details.mid[open]>summary{background:#eceefb;box-shadow:inset 4px 0 #2E3192}details.fin[open]>summary{background:#f6f0de;box-shadow:inset 4px 0 #a9976b}details.exam[open]>summary{background:#fbe9e9;box-shadow:inset 4px 0 #c55}
@media(prefers-color-scheme:dark){details.mid[open]>summary{background:#262452}details.fin[open]>summary{background:#352f1c}details.exam[open]>summary{background:#3a2020}}
.tag.due{background:#fff1c9;color:#7a5200;border:1px solid #e3c466}@media(prefers-color-scheme:dark){.tag.due{background:#4a3a10;color:#ffe29a;border-color:#7a6220}}li.ms{background:rgba(169,151,107,.12)}li.ms a{color:var(--acc)}.wr{display:grid;grid-template-columns:1fr 200px;gap:0 14px}.wr>details{margin:0 0 8px}
.lane{position:relative;min-height:46px}.lane .ln{position:absolute;left:9px;width:2px}
.ln.mid,.dot.mid{background:#2E3192}.ln.fin,.dot.fin{background:#a9976b}
.dot{position:absolute;left:4px;top:17px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.dot.start{background:var(--bg)!important;border:2px solid #2E3192}.dot.fin.start{border-color:#a9976b}
.dot.mid:not(.start)::before,.dot.fin:not(.start)::before{content:"";position:absolute;left:-1px;top:-14px;border:5px solid transparent;border-top:8px solid;border-bottom:0;color:inherit}
.dot.mid::before{border-top-color:#2E3192}.dot.fin::before{border-top-color:#a9976b}
.lb{position:absolute;left:26px;top:12px;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--ink);text-decoration:none}
.lb span{display:block;font-weight:400;color:var(--dim);font-size:11px}.lb.mid{color:#2E3192}.lb.fin{color:#8a7a45}
@media(prefers-color-scheme:dark){.lb.mid{color:#aeb1f2}.lb.fin{color:#d6cbb1}.dot.mid,.ln.mid{background:#8f92e6}.dot.start{border-color:#8f92e6}.dot.mid::before{border-top-color:#8f92e6}}
@media(max-width:760px){.wr{grid-template-columns:1fr}.lane{min-height:0;margin:-4px 0 8px}.lane .ln,.lane .dot{display:none}.lb{position:static;display:inline-block;margin:0 0 6px 4px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.lb span{display:inline;margin-left:6px}}
.w{max-width:1000px!important}
.lanehd{float:right;text-transform:none;letter-spacing:0}@media(max-width:760px){.lanehd{display:none}}</style></head><body><div class="w">
<h1>KSA · 강의 슬라이드 (한국어)</h1>
<div class="sub">2027-1 · 한수민 · suminhan@ksa.hs.kr</div>
<ul>
<li><a href="ml1/">Machine Learning 1 · 기계학습과 심층학습</a><span class="m">1~16주차 · 덱 48개 · 프로젝트 · 예상 문제</span></li>
<li><a href="ml2/">Machine Learning 2 · 강화학습</a><span class="m">1~16주차 · 프로젝트 공지 · 덱은 준비 중</span></li>
</ul>
</div></body></html>
