<title>AI 연구자 계보도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: 위 = 제목·조작, 가운데 = 출생 연도 축이 세로로 흐르는 계보 그래프, 오른쪽(좁으면 아래) = 고른 사람 카드 */
:root {
  --bg: #f6f6f9;
  --panel: #ffffff;
  --fg: #1b1c33;
  --muted: #6a6b85;
  --line: #d4d5e2;
  --navy: #262686;
  --gold: #b8892b;
  --red: #c0392b;
  --co: #1f8a5b;
  --cit: #8a5bd6;
  --biz: #d9711c;
  --org: #1f7f8a;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131f; --panel: #1b1c2c; --fg: #e8e8f2; --muted: #9a9bb5; --line: #34354d;
  --navy: #9a9bf5; --gold: #e0b357; --red: #ff7a6b; --co: #4cc98e; --cit: #b896f5; --biz: #f29a4a; --org: #4fc0cc; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12131f; --panel: #1b1c2c; --fg: #e8e8f2; --muted: #9a9bb5; --line: #34354d;
  --navy: #9a9bf5; --gold: #e0b357; --red: #ff7a6b; --co: #4cc98e; --cit: #b896f5; --biz: #f29a4a; --org: #4fc0cc; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
.wrap { display: flex; flex-direction: column; gap: 10px; height: 100%; box-sizing: border-box;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; }
header .t { min-width: 0; flex: 1 1 320px; }
.help { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; cursor: help; position: relative; vertical-align: 3px; }
.help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; left: 0;  top: 28px; z-index: 20; width: min(420px, 80vw); padding: 10px 12px; border-radius: 8px; background: var(--fg); color: var(--panel); font-size: 13px; font-weight: 400; line-height: 1.5; white-space: normal; text-align: left; }
header { align-items: center !important; }
aside { position: relative; }
aside .help { position: static; }
aside .help:hover::after, aside .help:focus::after { left: 16px; right: 16px; top: 52px; width: auto; }
h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); line-height: 1.5; max-width: 66ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; background: var(--panel); color: var(--fg); border: 0; padding: 6px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--panel); }
.pbtn { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.pbtn[aria-pressed="true"] { background: var(--co); color: var(--panel); border-color: var(--co); }
.plist li:hover { background: color-mix(in srgb, var(--co) 7%, transparent); }
.plist li { cursor: pointer; margin: 0 -8px; padding-left: 8px !important; padding-right: 8px !important; border-radius: 6px;
  display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.plist .yr { font-family: var(--f-mono); color: var(--muted); font-size: 12px; padding-top: 2px; }
.plist .gbtn { font: inherit; font-weight: 500; background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; text-align: left; }
.plist .gbtn:hover { color: var(--co); text-decoration: underline; }
.plist .who { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.5; }
.kind { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.chk { color: var(--co); font-size: 11px; margin-left: 4px; white-space: nowrap; }
input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); width: 200px; max-width: 100%; }
.layers { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.layers label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.layers .sw { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
.layers .lbl { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; }
.stage { position: relative; min-width: 0; min-height: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
svg { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--panel); font-size: 12px; padding: 4px 8px; border-radius: 6px; max-width: 260px; }
aside { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow: auto; }
.card-head { display: flex; gap: 12px; align-items: center; }
.ph { width: 72px; height: 72px; border-radius: 50%; flex: none; object-fit: cover; background: var(--line); display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--panel); }
aside h2 { margin: 0; font-size: 19px; text-wrap: balance; }
aside .en { color: var(--muted); font-size: 13px; margin-top: 2px; }
aside .where { margin-top: 4px; font-size: 13px; }
aside h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 500; }
aside ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; line-height: 1.45; }
aside ul.plain { list-style: none; padding: 0; }
aside li button, .pp button { font: inherit; background: none; border: 0; padding: 0; color: var(--navy); cursor: pointer; text-align: left; }
aside li button:hover, .pp button:hover { text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); }
.tag.biz { border-color: var(--biz); color: var(--biz); }
.paper { font-weight: 500; }
.pp { color: var(--muted); }
.cnt { font-family: var(--f-mono); color: var(--muted); font-size: 12px; }
.note { font-size: 12px; color: var(--red); }
.src { font-size: 12px; color: var(--muted); line-height: 1.55; }
.src a { color: var(--navy); }
.empty { color: var(--muted); line-height: 1.6; margin: 0; }
.credit { font-size: 12px; color: var(--muted); line-height: 1.5; }
.credit a { color: var(--navy); }
.node text { font-family: var(--f-body); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; fill: var(--fg); pointer-events: none; }
.node text.u { fill: var(--muted); font-size: 10px; }
.axis text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.axis line { stroke: var(--line); stroke-dasharray: 2 4; }
.axis text.field { font-family: var(--f-body); font-size: 26px; font-weight: 700; fill: var(--muted); opacity: 0.6; }
@media (max-width: 800px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 64vh auto; }
  html, body { height: auto; }
}
</style>

<div class="wrap">
  <header>
    <div class="t">
      <h1><span id="t-h1">AI 연구자 계보도</span> <span class="help" tabindex="0" aria-label="help" id="t-sub" data-tip="">?</span></h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="보여 줄 범위">
        <button id="scope-core" aria-pressed="true"><span id="t-core">연구자</span> <span id="n-core"></span></button>
        <button id="scope-biz" aria-pressed="false"><span id="t-biz">기업가</span> <span id="n-biz"></span></button>
        <button id="scope-all" aria-pressed="false"><span id="t-all">제자 전부</span> <span id="n-all"></span></button>
      </div>
      <div class="seg" role="group" aria-label="언어" hidden><button id="lang-ko" aria-pressed="true">한글</button><button id="lang-en" aria-pressed="false">English</button></div>
      <button id="papers-btn" class="pbtn">논문 · 프로젝트 목록</button>
      <input type="search" id="q" list="names" placeholder="이름 찾기 (예: 힌턴, Bengio)" aria-label="이름 찾기">
      <datalist id="names"></datalist>
    </div>
  </header>
  <div class="layers" role="group" aria-label="보여 줄 관계">
    <span class="lbl" id="t-rel">관계</span>
    <label><input type="checkbox" id="L-adv" checked><span class="sw" style="border-color:var(--navy)"></span><span id="t-adv">지도교수 → 제자</span></label>
    <label><input type="checkbox" id="L-collab" checked><span class="sw" style="border-color:var(--co)"></span><span id="t-collab">대표 공동 연구</span></label>
    <label><input type="checkbox" id="L-biz" checked><span class="sw" style="border-color:var(--biz);border-top-style:dashed"></span><span id="t-bizl">공동 창업</span></label>
    <label><input type="checkbox" id="L-co"><span class="sw" style="border-color:var(--co);border-top-style:dotted"></span><span id="t-co">같이 쓴 논문 (수)</span></label>
    <label><input type="checkbox" id="L-cit"><span class="sw" style="border-color:var(--cit)"></span><span id="t-cit">인용 (A → B)</span></label>
    <label><input type="checkbox" id="L-comp"><span class="sw" style="border-color:var(--biz);border-top-style:dotted"></span><span id="t-comp">회사</span></label>
    <label><input type="checkbox" id="L-uni"><span class="sw" style="border-color:var(--org);border-top-style:dotted"></span><span id="t-uni">대학 · 연구소</span></label>
  </div>
  <div class="main">
    <div class="stage">
      <svg id="g" aria-label="AI 연구자 관계 그래프"></svg>
      <div class="hint" id="t-hint">끌어서 이동 · 휠/두 손가락으로 확대</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
  <footer class="credit" id="t-credit"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DATA = __DATA__;
// 한글 / English 전환 (사람 이름 · 논문 이름). 선택은 이 브라우저에 기억
let LANG = "en";   // 지금은 English 만 (한글 전환 버튼은 숨겨 둠)
const name = n => LANG === "en" ? (n.en || n.ko) : (n.ko || n.en);
const gname = g => LANG === "en" ? g.p : g.pk;
const K = (ko, en) => LANG === "en" ? en : ko;
const AWE = { "튜링상": "Turing Award", "노벨 물리학상": "Nobel Prize in Physics", "노벨 화학상": "Nobel Prize in Chemistry" };
const F = (n, k) => LANG === "en" && n[k + "_en"] !== undefined ? n[k + "_en"] : n[k];   // 사람 · 회사의 영어 필드
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
DATA.orgs.forEach(o => byId.set(o.id, { ...o, org: true, aw: [] }));
const adv = new Map(), stu = new Map();
DATA.links.forEach(l => {
  if (!adv.has(l.t)) adv.set(l.t, []); adv.get(l.t).push(l);
  if (!stu.has(l.s)) stu.set(l.s, []); stu.get(l.s).push(l);
});
// 대표 공동 연구 · 공동 창업: 논문(회사) 하나에 사람 여럿 -> 둘씩 엣지
const groupEdges = [], groupsOf = new Map();
DATA.collab.forEach((g, gi) => {
  for (let i = 0; i < g.ids.length; i++) for (let j = i + 1; j < g.ids.length; j++)
    groupEdges.push({ s: g.ids[i], t: g.ids[j], k: g.biz ? "biz" : "collab", gi });
  g.ids.forEach(id => { if (!groupsOf.has(id)) groupsOf.set(id, []); groupsOf.get(id).push(gi); });
});

// 출생 연도가 없는 사람: 스승 + 30 / 제자 - 30 으로 어림 (위치만)
DATA.nodes.forEach(n => n.y0 = n.b || n.yEst);
for (let it = 0; it < 6; it++) DATA.nodes.forEach(n => {
  if (n.y0) return;
  const a = (adv.get(n.id) || []).map(l => byId.get(l.s).y0).filter(Boolean).map(y => Math.min(y + 28, 1996));
  const s = (stu.get(n.id) || []).map(l => byId.get(l.t).y0).filter(Boolean).map(y => y - 30);
  const v = a.concat(s); if (v.length) n.y0 = d3.mean(v);
});
DATA.nodes.forEach(n => { if (!n.y0) n.y0 = 1975; });


const dl = document.getElementById("names");
function fillNames() {
  dl.innerHTML = "";
  DATA.nodes.filter(n => n.fam || n.core).forEach(n => {
    const o = document.createElement("option"); o.value = LANG === "en" ? n.en : (n.ko ? `${n.ko} (${n.en})` : n.en); dl.appendChild(o);
  });
}
fillNames();

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const svg = d3.select("#g"), root = svg.append("g");
svg.append("defs").html(`
  <clipPath id="clip" clipPathUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5"></circle></clipPath>
  <marker id="ar" viewBox="0 -4 8 8" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L8,0L0,4" style="fill:var(--navy)"></path></marker>
  <marker id="arr" viewBox="0 -4 8 8" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,-4L8,0L0,4" style="fill:var(--red)"></path></marker>
  <marker id="arc" viewBox="0 -4 8 8" refX="8" refY="0" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,-4L8,0L0,4" style="fill:var(--cit)"></path></marker>`);
let k = 1;
const zoom = d3.zoom().scaleExtent([0.15, 6]).on("zoom", e => { root.attr("transform", e.transform); k = e.transform.k; labels(); });
svg.call(zoom);
let scope = "core", sel = null, lit = null, hov = null, nodeSel, linkSel, nodesNow = [];
const L = { adv: true, collab: true, biz: true, co: false, cit: false, comp: false, uni: false };
const gAxis = root.append("g").attr("class", "axis"), gLink = root.append("g"), gNode = root.append("g");
const Y = d3.scaleLinear();
// 유명 인물 크기 = h-index (넓이가 h 에 비례하도록 sqrt). h 없는 사람(기업가 등)은 작은 고정 크기
DATA.nodes.forEach(n => { if (n.fam) n.r = n.m ? 9 + 17 * Math.sqrt(n.m.h / 200) : 11; });
const FX = { dl: -700, ml: 0, rl: 700 };
const R = d => d.org ? 6 : d.fam ? d.r : d.core ? 4.5 : 2.6;

// 연구자 = h-index 있는 유명 인물 (+ 사이를 잇는 중간 세대), 기업가 = 창업 · 경영한 사람 + 회사
const isCompany = o => !(/universit|college|school|institute|polytechni|\bmila\b|idsia|max planck|inria|cnrs/i.test(o.en || "") || /대학|학교/.test(o.ko || ""));
function visibleIds() {
  const extra = focusGroup != null ? DATA.collab[focusGroup].ids : [];
  return new Set([...baseIds(), ...extra]);
}
function baseIds() {
  if (scope === "all") return new Set(DATA.nodes.map(n => n.id));
  if (scope === "biz") return new Set(DATA.nodes.filter(n => n.fam && n.ent).map(n => n.id));
  return new Set(DATA.nodes.filter(n => (n.fam && n.m) || n.chain).map(n => n.id));
}
// 회사 / 대학 · 연구소를 따로 켠다 (기업가 범위에서는 회사가 늘 켜짐)
const orgOn = () => L.comp || L.uni || scope === "biz";
const orgList = () => DATA.orgs.map(o => byId.get(o.id)).filter(o => isCompany(o) ? (L.comp || scope === "biz") : L.uni);
function layout(ids, nodes) {
  const ys = d3.extent(nodes.filter(n => !n.org), n => n.y0);
  // 1940년 이후 (사람이 몰린 구간)를 세로로 더 넓게
  const y0 = Math.floor(ys[0] / 10) * 10, y1 = Math.ceil(ys[1] / 10) * 10, f = scope === "all" ? 1.5 : 1;
  Y.domain([y0, 1940, y1]).range([0, 420 * f, (420 + (y1 - 1940) * 27) * f]);
  // 배치는 지도 관계 + 대표 공동 연구로만 정한다 (층을 켜고 꺼도 자리가 안 바뀌게)
  const ll = DATA.links.filter(l => ids.has(l.s) && ids.has(l.t)).map(l => ({ source: l.s, target: l.t, w: 0.6 }))
    .concat(groupEdges.filter(e => ids.has(e.s) && ids.has(e.t)).map(e => ({ source: e.s, target: e.t, w: e.k === "biz" ? 0.02 : 0.06 })))
    .concat(orgOn() ? DATA.olinks.filter(l => ids.has(l.s) && ids.has(l.t)).map(l => ({ source: l.s, target: l.t, w: scope === "biz" ? 0.3 : 0.03 })) : []);
  // 회사 · 대학: 이어진 사람들의 평균 세대 높이에 둔다
  nodes.filter(n => n.org).forEach(o => { const ys = DATA.olinks.filter(l => l.t === o.id && ids.has(l.s)).map(l => byId.get(l.s).y0); o.y0 = ys.length ? d3.mean(ys) + 6 : Y.domain()[2]; });
  // 출생 연도를 아는 사람은 그 높이에 고정 (fy), 모르는 사람만 위아래로 움직인다
  nodes.forEach((n, i) => { const a = Math.sin((i + 1) * 12.9898) * 43758.5453; n.x = (a - Math.floor(a) - 0.5) * 1400; n.y = Y(n.y0); n.fy = n.b ? Y(n.b) : null; });
  d3.forceSimulation(nodes)
    .force("link", d3.forceLink(ll).id(d => d.id).distance(60).strength(d => d.w))
    .force("charge", d3.forceManyBody().strength(d => d.org ? -200 : d.fam ? -700 : -50).distanceMax(600))
    .force("collide", d3.forceCollide(d => d.fam ? d.r + 24 : d.org ? 14 : d.core ? 10 : 5).strength(0.9))
    .force("y", d3.forceY(d => Y(d.y0)).strength(d => d.org ? 0.4 : 0.85))
    // 분야별 좌우: 딥러닝 왼쪽, 강화학습 오른쪽, 고전 ML · 통계 · 기호 AI 가운데
    .force("x", d3.forceX(d => FX[d.field] || 0).strength(d => d.fam ? 0.12 : 0.03))
    .stop().tick(360);
  nodes.forEach(n => { if (n.fy != null) n.y = n.fy; });
}
function build(relayout) {
  const ids = visibleIds();
  const E = [];
  if (L.adv) DATA.links.forEach(l => { if (ids.has(l.s) && ids.has(l.t)) E.push({ ...l, k: l.k === "manual" ? "manual" : "adv" }); });
  groupEdges.forEach(e => { if (L[e.k] && ids.has(e.s) && ids.has(e.t)) E.push({ ...e }); });
  if (L.co) DATA.co.forEach(c => { if (ids.has(c.a) && ids.has(c.b)) E.push({ s: c.a, t: c.b, k: "co", n: c.n }); });
  if (L.cit) DATA.cit.forEach(c => { if (ids.has(c.a) && ids.has(c.b) && c.n >= 2) E.push({ s: c.a, t: c.b, k: "cit", n: c.n }); });
  if (orgOn()) { const ok = new Set(orgList().map(o => o.id)); DATA.olinks.forEach(l => { if (ids.has(l.s) && ok.has(l.t)) E.push({ s: l.s, t: l.t, k: "org" }); }); }
  E.forEach(e => { e.source = byId.get(e.s); e.target = byId.get(e.t); });
