<title>데이터 월드컵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one scoreboard column; a match is two cards facing each other across a VS line. Single dark look, like a stadium screen. */
:root {
  color-scheme: dark;
  --ground: #121722;      /* night pitch */
  --panel: #1b2232;
  --line: #2c3548;
  --ink: #eef1f6;
  --muted: #9aa4b6;
  --gold: #f4c542;        /* trophy */
  --red: #ff6b5b;         /* the other corner */
  --blue: #6fa8ff;
  --display: "Black Han Sans", "Noto Sans KR", sans-serif;
  --body: "Noto Sans KR", -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--body); line-height: 1.55; font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.wrap { max-width: 1040px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
header { padding: 34px 0 10px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1; letter-spacing: .01em; margin: 0; }
.logo span { color: var(--gold); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 560px; text-wrap: balance; }
.round-tag { font-family: var(--display); font-size: 1.4rem; color: var(--gold); white-space: nowrap; }
/* start */
.start { display: grid; gap: 18px; padding: 18px 0; }
.modes { display: flex; flex-wrap: wrap; gap: 10px; }
.mode { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 18px; cursor: pointer; text-align: left; min-width: 160px; }
.mode b { display: block; font-family: var(--display); font-size: 1.5rem; font-weight: 400; }
.mode small { color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--gold); }
.go { font-family: var(--display); font-size: 1.5rem; background: var(--gold); color: #1a1406; border: 0; border-radius: 12px; padding: 12px 34px; cursor: pointer; justify-self: start; }
.go:hover { filter: brightness(1.08); }
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; }
.mosaic img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 4px; display: block; opacity: .85; }
/* match */
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .25s ease; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 14px; }
.vs { align-self: center; font-family: var(--display); font-size: 2rem; color: var(--gold); }
.card { display: flex; flex-direction: column; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; padding: 0; min-width: 0;
  transition: transform .15s ease, border-color .15s ease; }
.card:hover { transform: translateY(-4px); border-color: var(--gold); }
.card.win { border-color: var(--gold); transform: scale(1.02); }
.card.lose { opacity: .35; }
.card img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; display: block; }
.card .body { padding: 14px 16px 18px; display: grid; gap: 6px; }
.domain { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.3rem, 3.2vw, 1.75rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.q { margin: 0; font-size: 1rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: .78rem; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--muted); }
.chip.type { border-color: var(--blue); color: var(--blue); }
.hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 14px 0 0; }
.undo { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
/* result */
.champ { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; align-items: center; padding: 10px 0 6px; }
.champ img { width: 100%; border-radius: 16px; border: 3px solid var(--gold); display: block; }
.trophy { font-family: var(--display); color: var(--gold); font-size: 1.2rem; }
.champ h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 4px 0 8px; }
.podium { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
.podium li { display: flex; gap: 10px; align-items: baseline; }
.podium .rank { font-family: var(--display); color: var(--gold); min-width: 3.2em; }
.saved { font-size: .85rem; color: var(--muted); margin-top: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.ghost { background: none; border: 2px solid var(--line); border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
/* board */
section.board { margin-top: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.board h3 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0 0 4px; }
.board p.note { color: var(--muted); margin: 0 0 12px; font-size: .88rem; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.cols h4 { margin: 0 0 8px; font-size: .9rem; color: var(--muted); font-weight: 500; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 4.2em; gap: 8px; align-items: center; font-size: .9rem; }
.bar .track { position: relative; background: var(--ground); border-radius: 6px; overflow: hidden; height: 26px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--gold) 70%, transparent); border-radius: 6px; }
.bar .label { position: relative; padding: 0 8px; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { color: var(--muted); font-size: .9rem; }
details.credits { margin-top: 26px; color: var(--muted); font-size: .8rem; }
details.credits summary { cursor: pointer; }
details.credits ul { padding-left: 18px; }
details.credits a { color: var(--muted); }
@media (max-width: 720px) {
  .match { grid-template-columns: 1fr; }
  .vs { justify-self: center; font-size: 1.4rem; margin: -4px 0; }
  .champ, .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .card, .progress i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="logo">데이터 <span>월드컵</span></h1>
      <p class="sub">산업 현장에서 실제로 푸는 문제와 닮은 공개 데이터 32개. 둘 중 더 해 보고 싶은 데이터를 고르세요. 마지막에 남는 하나가 나의 데이터입니다.</p>
    </div>
    <div class="round-tag" id="roundTag" aria-live="polite"></div>
  </header>

  <main id="screen"></main>

  <section class="board" aria-labelledby="boardTitle">
    <h3 id="boardTitle">모두의 선택</h3>
    <p class="note" id="boardNote">월드컵을 끝낸 사람들의 결과가 여기에 모입니다.</p>
    <div class="cols">
      <div><h4>우승 횟수</h4><div class="bars" id="champBars"><p class="empty">아직 끝낸 사람이 없습니다. 첫 우승을 정해 주세요.</p></div></div>
      <div><h4>1:1 승률 (3경기 이상)</h4><div class="bars" id="rateBars"><p class="empty">경기 기록이 쌓이면 승률이 보입니다.</p></div></div>
    </div>
  </section>

  <details class="credits"><summary>사진 출처 (Wikimedia Commons)</summary><ul id="credits"></ul></details>
</div>

<script>
const CANDS = /*__CANDS__*/[];
const IMAGES = /*__IMAGES__*/{};
const CREDITS = /*__CREDITS__*/{};
const byId = Object.fromEntries(CANDS.map((c) => [c.id, c]));
const ROUND = { 32: "32강", 16: "16강", 8: "8강", 4: "준결승", 2: "결승" };
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let state = null;   // {size, round:[ids], next:[ids], k, history:[{a,b,w,size}], done}
let mode = 32;

function startScreen() {
  $("roundTag").textContent = "";
  const s = $("screen"); s.replaceChildren();
  const box = el("div", "start");
  const modes = el("div", "modes"); modes.setAttribute("role", "group"); modes.setAttribute("aria-label", "몇 강으로 할까요");
  [[32, "32강", "전부 · 31경기"], [16, "16강", "무작위 16개 · 15경기"]].forEach(([n, t, d]) => {
    const b = el("button", "mode"); b.type = "button"; b.setAttribute("aria-pressed", String(mode === n));
    b.append(el("b", "", t), el("small", "", d));
    b.addEventListener("click", () => { mode = n; startScreen(); });
    modes.append(b);
  });
  const go = el("button", "go", "시작하기"); go.type = "button"; go.addEventListener("click", newGame);
  const mosaic = el("div", "mosaic");
  CANDS.forEach((c) => { const im = el("img"); im.src = IMAGES[c.id]; im.alt = c.title; im.title = c.title; mosaic.append(im); });
  box.append(modes, go, mosaic);
  s.append(box);
}

function newGame() {
  const ids = shuffle(CANDS.map((c) => c.id)).slice(0, mode);
  state = { size: mode, round: ids, next: [], k: 0, history: [], done: false };
  renderMatch();
}

function cardFor(id, side) {
  const c = byId[id];
  const b = el("button", "card"); b.type = "button"; b.dataset.side = side;
  const img = el("img"); img.src = IMAGES[id]; img.alt = ""; img.width = 480; img.height = 300;
  const body = el("div", "body");
  const meta = el("div", "meta"); meta.append(el("span", "chip type", c.type), el("span", "chip", c.data));
  body.append(el("div", "domain", c.domain), el("h2", "", c.title), el("p", "q", c.q), meta);
  b.append(img, body);
  b.setAttribute("aria-label", `${c.title}: ${c.q} 고르기`);
  return b;
}

function renderMatch() {
  const n = state.round.length;
  const a = state.round[state.k * 2], b = state.round[state.k * 2 + 1];
  const total = n / 2;
  $("roundTag").textContent = `${ROUND[n]} ${state.k + 1} / ${total}`;
  const s = $("screen"); s.replaceChildren();
  const prog = el("div", "progress"); const fill = el("i"); prog.append(fill);
  const played = state.history.length, all = state.size - 1;
  fill.style.width = `${(played / all) * 100}%`;
  const m = el("div", "match");
  const ca = cardFor(a, "a"), cb = cardFor(b, "b");
  m.append(ca, el("div", "vs", "VS"), cb);
  const hint = el("p", "hint", "더 해 보고 싶은 쪽을 누르세요. 키보드: ← 왼쪽, → 오른쪽 ");
  if (state.history.length) { const u = el("button", "undo", "한 경기 되돌리기"); u.type = "button"; u.addEventListener("click", undo); hint.append(u); }
  s.append(prog, m, hint);
  [ca, cb].forEach((card) => card.addEventListener("click", () => pick(card.dataset.side === "a" ? a : b, a, b, ca, cb)));
}

let locked = false;
function pick(w, a, b, ca, cb) {
  if (locked) return; locked = true;
  (w === a ? ca : cb).classList.add("win"); (w === a ? cb : ca).classList.add("lose");
  setTimeout(() => {
    locked = false;
    state.history.push({ a, b, w, n: state.round.length });
    state.next.push(w); state.k += 1;
    if (state.k * 2 >= state.round.length) {
      if (state.next.length === 1) { state.done = true; finish(); return; }
      state.round = state.next; state.next = []; state.k = 0;
    }
    renderMatch();
  }, 320);
}

function undo() {
  if (!state.history.pop()) return;
  replay();
}
function replay() {
  // rebuild the bracket from the first-round order and the remaining picks
  const hist = state.history;
  state.round = state.initial; state.next = []; state.k = 0;
  for (const h of hist) {
    state.next.push(h.w); state.k += 1;
    if (state.k * 2 >= state.round.length) { state.round = state.next; state.next = []; state.k = 0; }
  }
  renderMatch();
}

function ranking() {
  // champion, finalist, semi-finalists by the round they lost in
  const lostAt = {};
  state.history.forEach((h) => { lostAt[h.w === h.a ? h.b : h.a] = h.n; });
  const champ = state.history[state.history.length - 1].w;
  const order = Object.entries(lostAt).sort((x, y) => x[1] - y[1]).map(([id]) => id);
  return { champ, finalist: order[0], semis: order.slice(1, 3) };
}

async function finish() {
  $("roundTag").textContent = "우승";
  const r = ranking(); const c = byId[r.champ];
  const s = $("screen"); s.replaceChildren();
  const box = el("div", "champ");
  const img = el("img"); img.src = IMAGES[r.champ]; img.alt = c.title;
  const right = el("div");
  right.append(el("div", "trophy", "나의 데이터"), el("h2", "", c.title), el("p", "q", c.q));
  const meta = el("div", "meta"); meta.append(el("span", "chip type", c.type), el("span", "chip", c.data)); right.append(meta);
  const pod = el("ol", "podium");
  [["준우승", r.finalist], ["4강", r.semis[0]], ["4강", r.semis[1]]].forEach(([t, id]) => {
    if (!id) return; const li = el("li"); li.append(el("span", "rank", t), el("span", "", byId[id].title)); pod.append(li);
  });
  right.append(pod);
  const saved = el("p", "saved", "결과를 저장하는 중…"); right.append(saved);
  const act = el("div", "actions");
  const again = el("button", "go", "다시 하기"); again.type = "button"; again.addEventListener("click", newGame);
  const home = el("button", "ghost", "처음으로"); home.type = "button"; home.addEventListener("click", startScreen);
  act.append(again, home); right.append(act);
  box.append(img, right); s.append(box);
  saved.textContent = await save(r);
}

// ---------- shared results (db) ----------
let dbRef = null, userRef = null, myId = null;
async function save(r) {
  if (!dbRef || !myId) return "결과는 이 화면에만 남습니다 (로그인하면 '모두의 선택' 에 더해집니다).";
  const wins = {}, played = {};
  state.history.forEach((h) => { wins[h.w] = (wins[h.w] || 0) + 1; played[h.a] = (played[h.a] || 0) + 1; played[h.b] = (played[h.b] || 0) + 1; });
  try {
    await dbRef.doc("results/" + myId).set({ size: state.size, champion: r.champ, finalist: r.finalist || "", semis: r.semis, wins, played, at: Date.now() });
    return "결과를 '모두의 선택' 에 더했습니다. 다시 하면 내 결과가 새 결과로 바뀝니다.";
  } catch (e) {
    return "결과를 저장하지 못했습니다 (이 페이지를 볼 수만 있는 권한일 수 있습니다). 내 결과는 이 화면에만 남습니다.";
  }
}

function bars(target, rows, fmt) {
  const box = $(target); box.replaceChildren();
  if (!rows.length) return false;
  const max = Math.max(...rows.map((r) => r[1]));
  rows.forEach(([id, v, extra]) => {
    const row = el("div", "bar"); const track = el("div", "track"); const fill = el("i", "fill");
    fill.style.width = `${(v / max) * 100}%`;
    const label = el("span", "label", byId[id] ? byId[id].title : id);
    track.append(fill, label); row.append(track, el("span", "val", fmt(v, extra))); box.append(row);
  });
  return true;
}

function renderBoard(docs) {
  const champ = {}, wins = {}, played = {};
  docs.forEach((d) => {
    if (d.champion) champ[d.champion] = (champ[d.champion] || 0) + 1;
    Object.entries(d.wins || {}).forEach(([k, v]) => { wins[k] = (wins[k] || 0) + v; });
    Object.entries(d.played || {}).forEach(([k, v]) => { played[k] = (played[k] || 0) + v; });
  });
  $("boardNote").textContent = docs.length ? `${docs.length}명이 월드컵을 끝냈습니다 (한 사람당 마지막 결과 하나).` : "월드컵을 끝낸 사람들의 결과가 여기에 모입니다.";
  const c = Object.entries(champ).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (!bars("champBars", c, (v) => `${v}번`)) $("champBars").replaceChildren(el("p", "empty", "아직 끝낸 사람이 없습니다. 첫 우승을 정해 주세요."));
  const r = Object.keys(played).filter((k) => played[k] >= 3).map((k) => [k, (wins[k] || 0) / played[k], played[k]]).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (!bars("rateBars", r, (v, n) => `${Math.round(v * 100)}%`)) $("rateBars").replaceChildren(el("p", "empty", "경기 기록이 쌓이면 승률이 보입니다."));
}

async function connect() {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (!db || !user) return;
    dbRef = db; userRef = user; myId = await user.id();
    db.collection("results").onSnapshot((snap) => renderBoard(snap.docs.map((d) => d.data() || {})), () => {});
  } catch (e) { /* page works without shared results */ }
}

// keyboard: left / right
document.addEventListener("keydown", (e) => {
  if (!state || state.done || locked) return;
  const cards = document.querySelectorAll(".card");
  if (cards.length !== 2) return;
  if (e.key === "ArrowLeft") cards[0].click();
  if (e.key === "ArrowRight") cards[1].click();
});

// credits
Object.entries(CREDITS).forEach(([id, c]) => {
  const li = el("li");
  if (!c) { li.textContent = `${byId[id].title}: 직접 그린 패턴 그림 (원형 · 쪼개기와 모으기 · 한곳에 모으기)`; }
  else { const a = el("a", "", c.title); a.href = c.page; a.target = "_blank"; a.rel = "noopener"; li.append(`${byId[id].title}: `, a, ` · ${c.artist} · ${c.license}`); }
  $("credits").append(li);
});

// keep the first-round order for undo
const _newGame = newGame;
newGame = function () { _newGame(); state.initial = state.round.slice(); };
startScreen();
connect();
</script>
